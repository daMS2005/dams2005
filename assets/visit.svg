<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 88" width="520" height="88" role="img" aria-label="Visit daniel-mora.com">
  <defs>
    <linearGradient id="dop" x1="0" x2="1"><stop offset="0" stop-color="#fff4dc"/><stop offset=".35" stop-color="#ffb347"/><stop offset=".7" stop-color="#ff5c2a"/><stop offset="1" stop-color="#7a1a0a"/></linearGradient>
    <style>
      .ring { transform-origin: 52px 44px; animation: spin 6s linear infinite; }
      .pulse { transform-origin: 52px 44px; animation: pulse 2.4s ease-out infinite; }
      .arrow { animation: nudge 2.4s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { from { transform: scale(.8); opacity: .7; } to { transform: scale(1.9); opacity: 0; } }
      @keyframes nudge { 50% { transform: translateX(6px); } }
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect x="1" y="1" width="518" height="86" rx="12" fill="#000" stroke="#ff5c2a" stroke-opacity=".6"/>
  <circle class="pulse" cx="52" cy="44" r="18" fill="none" stroke="#ff5c2a" stroke-width="1.2"/>
  <circle cx="52" cy="44" r="16" fill="#000" stroke="url(#dop)" stroke-width="4"/>
  <circle class="ring" cx="52" cy="44" r="22" fill="none" stroke="#ffb347" stroke-width="1" stroke-dasharray="3 7 14 9" opacity=".7"/>
  <text x="92" y="52" fill="#ffffff" font-size="26" font-weight="600">Visit daniel-mora.com</text>
  <g class="arrow"><path d="M436 44h34m-12-12 12 12-12 12" fill="none" stroke="#ff5c2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
